[pytest]
# Sem isto, `pytest` só funciona invocado como `python -m pytest`, que é o
# único jeito que põe a pasta atual no sys.path. Rodar `pytest` direto —
# o que qualquer um tenta primeiro, e o que a compilação fazia — falhava
# com "No module named 'app_facilitador'" em todos os arquivos de teste.
pythonpath = .
testpaths = tests

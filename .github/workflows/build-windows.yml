# Compila o App Facilitador para Windows e publica o download.
#
# A compilação precisa acontecer no Windows: o PyInstaller não faz
# compilação cruzada — ele empacota o interpretador da máquina em que
# roda. Como o desenvolvimento acontece no Linux, é este runner que
# produz o executável que o usuário baixa.

name: Compilar app para Windows

# Roda nos dois casos, com desfechos diferentes:
#
#   push no branch padrão  -> compila, verifica E publica a release
#   pull request           -> compila e verifica, sem publicar nada
#
# O gatilho de pull request existe porque, sem ele, um branch só era
# compilado depois de já ter entrado no padrão — a quebra aparecia quando
# já não havia o que revisar. É a mesma verificação, adiantada para antes
# do merge.
on:
  push:
    branches: [claude/task-proposal-management-app-vt4xvm]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest

    env:
      # O Chromium é baixado para dentro do projeto, e não para a pasta
      # padrão do perfil, para que o PyInstaller consiga empacotá-lo.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\pw-browsers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Rodar os testes
        # Antes de empacotar: um executável quebrado publicado é pior que
        # nenhum executável, porque o usuário perde tempo baixando.
        run: pytest -q

      - name: Baixar o Chromium que vai dentro do app
        # O app usa este Chromium, e não o Edge do Windows: o Edge não
        # preservava a conta do Outlook entre execuções na máquina do
        # usuário, obrigando a logar de novo o tempo todo.
        #
        # `--no-shell` corta 323 MB do download do usuário. Sem ele, o
        # Playwright baixa TAMBÉM o "chrome-headless-shell", um segundo
        # navegador que só é usado em modo headless — e o app abre a janela
        # de cara (o usuário precisa vê-la para logar). Para que a
        # verificação headless logo abaixo continue funcionando sem esse
        # binário, `open_browser_context` pede `channel="chromium"`.
        run: playwright install --no-shell chromium

      - name: Compilar
        run: pyinstaller --clean --noconfirm AppFacilitador.spec

      - name: Verificar o que foi gerado
        # Compilar sem erro não prova que funciona. São duas provas
        # diferentes: que o painel sobe (templates e CSS empacotados) e
        # que o navegador abre (driver do Playwright e Chromium
        # empacotados). Um app que só falha na segunda pareceria bom até
        # a hora de conectar ao Outlook.
        run: |
          $env:APP_FACILITADOR_DATA = "$env:RUNNER_TEMP\dados-teste"

          .\dist\AppFacilitador\AppFacilitador.exe --verificar
          if ($LASTEXITCODE -ne 0) { throw "O painel não subiu a partir do executável" }

          .\dist\AppFacilitador\AppFacilitador.exe --verificar-navegador
          if ($LASTEXITCODE -ne 0) { throw "O executável não conseguiu abrir o navegador" }

      - name: Medir o tamanho do que foi gerado
        # O tamanho do download é um requisito, não um detalhe: já esteve
        # perto de 1 GB por embarcar navegadores que o app nunca executa
        # (ver AppFacilitador.spec). Imprimir a conta a cada compilação faz
        # uma regressão dessas aparecer aqui, e não na máquina do usuário.
        run: |
          $mb = [math]::Round((Get-ChildItem -Recurse dist\AppFacilitador |
                Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "Pasta do app: $mb MB"
          Get-ChildItem dist\AppFacilitador\_internal\playwright-browsers -EA SilentlyContinue |
            ForEach-Object { Write-Host "  navegador embarcado: $($_.Name)" }

      - name: Compactar para download
        run: Compress-Archive -Path dist\AppFacilitador -DestinationPath AppFacilitador-windows.zip

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AppFacilitador-windows
          path: AppFacilitador-windows.zip
          if-no-files-found: error

      - name: Publicar release para download
        # Só no branch padrão. Num pull request tudo acima já rodou — a
        # compilação e as duas verificações —, e é isso que se quer saber
        # antes do merge; publicar uma release por PR encheria a página de
        # downloads de versões que ninguém deveria baixar.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # O texto abaixo usa here-string de aspas simples (@'...'@): assim o
        # PowerShell não interpreta as crases do markdown como caractere de
        # escape nem tenta expandir nada. O commit entra por substituição.
        run: |
          $tag = "v$($env:GITHUB_RUN_NUMBER)"
          $notas = @'
          Baixe o **AppFacilitador-windows.zip** abaixo, **extraia a pasta** e
          dê dois cliques em `AppFacilitador.exe` dentro dela.

          Não precisa instalar Python, nem navegador, nem nada: o Chromium que o
          app usa vem junto. Por isso o zip é grande — e por isso ele é um zip e
          não um `.exe` solto: num arquivo único o Windows precisaria descompactar
          o navegador inteiro a cada abertura.

          **Na primeira vez**, o Windows pode mostrar um aviso azul de SmartScreen,
          porque o programa não tem assinatura digital paga. Clique em
          **Mais informações** e depois em **Executar assim mesmo**.

          Depois, no painel, clique em **Conectar ao Outlook** e entre com sua conta
          Microsoft. O acesso fica guardado num perfil de navegador próprio do app,
          então dura como duraria no seu navegador do dia a dia.

          Seus dados ficam em `%LOCALAPPDATA%\AppFacilitador` e não saem da sua máquina.

          Compilado a partir do commit COMMIT_SHA.
          '@
          $notas = $notas.Replace("COMMIT_SHA", $env:GITHUB_SHA)
          Set-Content -Path notas-release.md -Value $notas -Encoding utf8

          # Re-executar o mesmo build reaproveita o número da run e, com ele,
          # a tag: nesse caso substituímos o anexo em vez de falhar.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag AppFacilitador-windows.zip --clobber
          } else {
            gh release create $tag AppFacilitador-windows.zip `
              --title "App Facilitador $tag" `
              --notes-file notas-release.md `
              --target $env:GITHUB_SHA
          }
